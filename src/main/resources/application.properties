spring.application.name=app

spring.datasource.url=jdbc:h2:mem:shopwise;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Schema gere par Flyway (src/main/resources/db/migration) : Hibernate verifie seulement la coherence des entites
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console
# Console H2 desactivee : elle contournerait l'authentification de l'API
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
# Flyway est seul responsable du schema et des donnees : pas de schema.sql / data.sql Spring
spring.sql.init.mode=never

# --- Securite (US 4 et 5) ---
# Cle de signature HMAC-SHA256 des jetons (Base64, 256 bits minimum).
# Valeur de DEVELOPPEMENT uniquement : a remplacer en production via la variable SHOPWISE_JWT_SECRET.
shopwise.security.jwt.secret=${SHOPWISE_JWT_SECRET:u4Bsfndib+/pdIsTFExsZsseMsLOukyMcNaUIy7XzL8=}
shopwise.security.jwt.expiration=PT1H
shopwise.security.jwt.issuer=shopwise
# Comptes crees au demarrage s'ils n'existent pas encore (mots de passe surchargeables par variables d'environnement)
shopwise.security.bootstrap-users[0].username=admin
shopwise.security.bootstrap-users[0].password=${SHOPWISE_ADMIN_PASSWORD:admin123}
shopwise.security.bootstrap-users[0].role=ADMIN
shopwise.security.bootstrap-users[1].username=merchant
shopwise.security.bootstrap-users[1].password=${SHOPWISE_MERCHANT_PASSWORD:merchant123}
shopwise.security.bootstrap-users[1].role=MERCHANT
shopwise.security.bootstrap-users[2].username=viewer
shopwise.security.bootstrap-users[2].password=${SHOPWISE_VIEWER_PASSWORD:viewer123}
shopwise.security.bootstrap-users[2].role=VIEWER
