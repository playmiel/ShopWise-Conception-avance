spring.application.name=app

spring.datasource.url=jdbc:h2:mem:shopwise;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Schema gere par Flyway (src/main/resources/db/migration) : Hibernate verifie seulement la coherence des entites
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
# Flyway est seul responsable du schema et des donnees : pas de schema.sql / data.sql Spring
spring.sql.init.mode=never
