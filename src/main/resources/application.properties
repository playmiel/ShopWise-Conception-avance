spring.application.name=app

# Base H2 en memoire par defaut (developpement, tests). Driver et dialecte sont deduits de l'URL :
# en Docker, SPRING_DATASOURCE_URL pointe vers PostgreSQL sans autre changement.
spring.datasource.url=jdbc:h2:mem:shopwise;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# Schema gere par Flyway (src/main/resources/db/migration) : Hibernate verifie seulement la coherence des entites
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 console
# Console H2 desactivee : elle contournerait l'authentification de l'API
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.jpa.open-in-view=false
spring.flyway.locations=classpath:db/migration
# Flyway est seul responsable du schema et des donnees : pas de schema.sql / data.sql Spring
spring.sql.init.mode=never

# --- Securite (US 4 et 5) ---
# Cle de signature HMAC-SHA256 des jetons (Base64, 256 bits minimum).
# Valeur de DEVELOPPEMENT uniquement : a remplacer en production via la variable SHOPWISE_JWT_SECRET.
shopwise.security.jwt.secret=${SHOPWISE_JWT_SECRET:u4Bsfndib+/pdIsTFExsZsseMsLOukyMcNaUIy7XzL8=}
shopwise.security.jwt.expiration=PT1H
shopwise.security.jwt.issuer=shopwise
# Comptes crees au demarrage s'ils n'existent pas encore (mots de passe surchargeables par variables d'environnement)
shopwise.security.bootstrap-users[0].username=admin
shopwise.security.bootstrap-users[0].password=${SHOPWISE_ADMIN_PASSWORD:admin123}
shopwise.security.bootstrap-users[0].role=ADMIN
shopwise.security.bootstrap-users[1].username=merchant
shopwise.security.bootstrap-users[1].password=${SHOPWISE_MERCHANT_PASSWORD:merchant123}
shopwise.security.bootstrap-users[1].role=MERCHANT
shopwise.security.bootstrap-users[2].username=viewer
shopwise.security.bootstrap-users[2].password=${SHOPWISE_VIEWER_PASSWORD:viewer123}
shopwise.security.bootstrap-users[2].role=VIEWER

# --- Recommandations (US 7 et 8) ---
# Reentrainement periodique du modele (en plus du demarrage et de POST /api/recommendations/model/retrain)
shopwise.recommendation.retrain-cron=0 0 * * * *
# Poids du modele hybride (normalises) ; une strategie sans poids est ignoree
shopwise.recommendation.weights.item2vec=0.60
shopwise.recommendation.weights.content=0.25
shopwise.recommendation.weights.popularity=0.15
# Reseau Item2Vec (embeddings de produits appris sur les paniers)
shopwise.recommendation.item2vec.dimensions=24
shopwise.recommendation.item2vec.epochs=40
shopwise.recommendation.item2vec.learning-rate=0.05
shopwise.recommendation.item2vec.negative-samples=5
shopwise.recommendation.item2vec.seed=42
# Popularite : poids d'une vente divise par deux tous les 30 jours
shopwise.recommendation.popularity.half-life=P30D

# --- Supervision ---
# Seul l'etat de sante est expose (pas d'information sensible) ; la sonde readiness ne passe a UP
# qu'une fois l'application prete (comptes crees, donnees de demo chargees, modele entraine).
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
